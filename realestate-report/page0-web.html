<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VerifyHome — 내가 살 집, 제대로 확인하세요</title>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy:  #0F1B35;
    --navy2: #1A2E52;
    --blue:  #1E5EFF;
    --blue-light: #EEF3FF;
    --text-primary: #0F1B35;
    --text-secondary: #5A6476;
    --text-muted: #9AA2B4;
    --border: #E4E8F2;
    --radius-lg: 20px;
    --shadow-md: 0 4px 20px rgba(15,27,53,0.09);
    --shadow-lg: 0 8px 40px rgba(15,27,53,0.13);
  }

  html {
    font-family: 'Pretendard', -apple-system, sans-serif;
    background: #FFFFFF;
    color: var(--navy);
    font-size: 15px;
  }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  /* ── Center Stage ── */
  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
    width: 100%;
    max-width: 640px;
    padding: 0 24px;
    /* 살짝 위로 올려서 구글처럼 시각적 중심 맞춤 */
    margin-top: -60px;
  }

  /* ── Wordmark ── */
  .wordmark {
    font-size: 52px;
    font-weight: 900;
    letter-spacing: -1.5px;
    line-height: 1;
    user-select: none;
  }
  .wordmark-verify { color: var(--blue); }
  .wordmark-home   { color: var(--navy); }

  /* ── Tagline ── */
  .tagline {
    font-size: 22px;
    color: var(--text-primary);
    font-weight: 700;
    text-align: center;
    line-height: 1.5;
    letter-spacing: -0.3px;
  }
  .tagline-sub {
    display: block;
    font-size: 14px;
    font-weight: 400;
    color: var(--text-secondary);
    margin-top: 8px;
    line-height: 1.6;
  }

  /* ── Search Bar ── */
  .search-wrap {
    width: 100%;
    position: relative;
  }

  .search-input {
    width: 100%;
    height: 58px;
    padding: 0 60px 0 24px;
    border: 1.5px solid var(--border);
    border-radius: 30px;
    font-family: inherit;
    font-size: 16px;
    color: var(--navy);
    background: #fff;
    outline: none;
    box-shadow: var(--shadow-md);
    transition: border-color 0.18s, box-shadow 0.18s;
    cursor: pointer;
  }
  .search-input::placeholder { color: var(--text-muted); }
  .search-input:focus {
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(30,94,255,0.12), var(--shadow-md);
  }

  .search-btn {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    width: 42px;
    height: 42px;
    background: var(--blue);
    border: none;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, transform 0.1s;
  }
  .search-btn:hover  { background: #1650e0; }
  .search-btn:active { transform: translateY(-50%) scale(0.94); }
  .search-btn svg { fill: #fff; width: 18px; height: 18px; }

  /* ── Autocomplete Dropdown ── */
  .dropdown {
    display: none;
    position: absolute;
    top: calc(100% + 6px);
    left: 0; right: 0;
    background: #fff;
    border: 1.5px solid var(--border);
    border-radius: 16px;
    box-shadow: var(--shadow-lg);
    overflow: hidden;
    z-index: 100;
  }
  .dropdown-item {
    padding: 12px 20px;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
    transition: background 0.12s;
  }
  .dropdown-item:last-child { border-bottom: none; }
  .dropdown-item:hover,
  .dropdown-item.focused { background: var(--blue-light); }
  .dropdown-bdnm {
    font-size: 14px; font-weight: 700; color: var(--navy);
    margin-bottom: 2px;
  }
  .dropdown-addr {
    font-size: 12px; color: var(--text-muted);
  }

  /* ── Size Chips ── */
  .size-panel {
    display: none;
    flex-direction: column;
    gap: 10px;
    width: 100%;
  }
  .size-label {
    font-size: 13px; color: var(--text-secondary); font-weight: 600;
  }
  .size-chips {
    display: flex; flex-wrap: wrap; gap: 8px;
  }
  .size-chip {
    padding: 7px 18px;
    border-radius: 30px;
    border: 1.5px solid var(--border);
    font-size: 14px; font-weight: 500;
    cursor: pointer; color: var(--text-secondary);
    background: #fff;
    transition: all 0.15s;
  }
  .size-chip:hover { border-color: var(--blue); color: var(--blue); }
  .size-chip.active {
    background: var(--blue); border-color: var(--blue);
    color: #fff; font-weight: 600;
  }

  /* ── Hint ── */
  .hint {
    font-size: 13px;
    color: var(--text-muted);
    text-align: center;
  }
  .hint-error {
    font-size: 13px;
    color: #e05050;
    text-align: center;
  }

  /* ── Footer ── */
  footer {
    position: fixed;
    bottom: 28px;
    font-size: 12px;
    color: var(--text-muted);
    text-align: center;
    width: 100%;
  }
</style>
</head>
<body>

<main class="stage">

  <!-- Wordmark -->
  <div class="wordmark">
    <span class="wordmark-verify">Verify</span><span class="wordmark-home">Home</span>
  </div>

  <!-- Tagline -->
  <p class="tagline">이 집 시세, 비교해봤어요?<br><span class="tagline-sub">주소 하나로 근처 동네 같은 평형 실거래가 비교 + AI와 가격 차이 이유를 상담해보세요</span></p>

  <!-- Search -->
  <div class="search-wrap">
    <input
      class="search-input"
      type="text"
      placeholder="아파트 주소 검색 (클릭)"
      id="addressInput"
      autocomplete="off"
      readonly
    />
    <button class="search-btn" onclick="goVerify()" aria-label="검증 시작">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M10 2a8 8 0 105.293 14.121l4.293 4.293 1.414-1.414-4.293-4.293A8 8 0 0010 2zm0 2a6 6 0 110 12A6 6 0 0110 4z"/>
      </svg>
    </button>
  </div>

  <!-- Size Chips -->
  <div class="size-panel" id="sizePanel">
    <div class="size-label">몇 평형을 보시겠어요?</div>
    <div class="size-chips" id="sizeChips"></div>
  </div>

  <!-- Hint -->
  <p class="hint">입력창을 클릭하면 주소 검색 팝업이 열려요</p>

</main>

<footer>© 2026 VerifyHome · 데이터 기반 부동산 검증 서비스</footer>

<script>
  // ── 상태 ──────────────────────────────────────────────────────────
  let selectedAddr = null;  // Daum 콜백 결과 + { aptName, lawdCd, dong }
  let aptMatch     = null;  // /api/apt-match 결과 { lat, lng }
  let selectedSize = null;

  const input = document.getElementById('addressInput');

  // 인풋 클릭 → Daum 팝업
  input.addEventListener('click', openDaumPostcode);

  // ── Daum 팝업 ────────────────────────────────────────────────────
  function openDaumPostcode() {
    new daum.Postcode({
      oncomplete: function(data) {
        // data.buildingName  : 아파트명 (예: "역삼래미안")
        // data.sigunguCode   : 시군구코드 5자리 = lawd_cd (예: "11680")
        // data.bname         : 법정동 (예: "역삼동")
        // data.x / data.y    : 경도/위도 WGS84 (apt-match fallback용)
        const aptName = data.buildingName || data.roadAddress;
        const lawdCd  = data.sigunguCode;
        const dong    = data.bname;

        // 상태 초기화
        selectedAddr = { ...data, aptName, lawdCd, dong };
        selectedSize = null;
        aptMatch     = null;

        // UI 업데이트
        input.value = aptName;
        document.getElementById('sizePanel').style.display = 'none';

        // 캐시 워밍 + 평형 목록 + 좌표 — 동시 실행
        if (lawdCd) {
          fetch(`/api/prefetch?lawd_cd=${lawdCd}`).catch(() => {});
        }
        Promise.allSettled([
          fetchAptSizes(lawdCd, aptName, dong),
          fetchAptMatch(aptName, lawdCd, dong),
        ]).then(([, matchResult]) => {
          if (matchResult.status === 'fulfilled' && matchResult.value?.lat) {
            aptMatch = matchResult.value;
          }
        });
      }
    }).open();
  }

  // ── API 호출 ─────────────────────────────────────────────────────
  async function fetchAptMatch(bdNm, sggCd, dong) {
    try {
      const dongParam = dong ? `&dong=${encodeURIComponent(dong)}` : '';
      const res = await fetch(
        `/api/apt-match?bd_nm=${encodeURIComponent(bdNm)}&sgg_cd=${sggCd}${dongParam}`,
        { signal: AbortSignal.timeout(5000) }
      );
      if (!res.ok) return null;
      return await res.json();
    } catch { return null; }
  }

  async function fetchAptSizes(lawd_cd, apt_name, dong) {
    try {
      if (!lawd_cd || !apt_name) return;
      const dongParam = dong ? `&dong=${encodeURIComponent(dong)}` : '';
      const res = await fetch(
        `/api/apt-sizes?lawd_cd=${lawd_cd}&apt_name=${encodeURIComponent(apt_name)}${dongParam}`,
        { signal: AbortSignal.timeout(10000) }
      );
      if (!res.ok) return;
      const data = await res.json();
      showSizeChips(data.sizes || []);
    } catch {}
  }

  // ── UI 헬퍼 ──────────────────────────────────────────────────────
  function showSizeChips(sizes) {
    if (!sizes.length) return;
    const panel = document.getElementById('sizePanel');
    document.getElementById('sizeChips').innerHTML = sizes
      .map(s => `<div class="size-chip" onclick="selectSize(this, ${s})">${s}평</div>`)
      .join('');
    panel.style.display = 'flex';
  }

  function selectSize(el, pyeong) {
    selectedSize = pyeong;
    document.querySelectorAll('.size-chip').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
  }

  function showError(msg) {
    const hint = document.querySelector('.hint');
    hint.textContent = msg;
    hint.className = 'hint-error';
    setTimeout(() => {
      hint.textContent = '입력창을 클릭하면 주소 검색 팝업이 열려요';
      hint.className = 'hint';
    }, 3000);
  }

  // ── 이동 ─────────────────────────────────────────────────────────
  function goVerify() {
    if (!selectedAddr) { openDaumPostcode(); return; }

    let url = '/market?address=' + encodeURIComponent(selectedAddr.aptName);
    url += '&lawd_cd='  + selectedAddr.lawdCd;
    url += '&apt_name=' + encodeURIComponent(selectedAddr.aptName);
    if (selectedAddr.dong) url += '&dong=' + encodeURIComponent(selectedAddr.dong);

    // apt-match DB 좌표 우선 → Daum x/y(WGS84) fallback
    if (aptMatch?.lat) {
      url += '&lat=' + aptMatch.lat + '&lng=' + aptMatch.lng;
    } else if (selectedAddr.y && selectedAddr.x) {
      url += '&lat=' + selectedAddr.y + '&lng=' + selectedAddr.x;
    }
    if (selectedSize) url += '&pyeong=' + selectedSize;
    window.location.href = url;
  }
</script>

<script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>

</body>
</html>
